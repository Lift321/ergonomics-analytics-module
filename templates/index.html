<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moduł analityki i kalibracji ergonomii pracy</title>
    <style>
        body { font-family: Segoe UI, Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 24px; }
        .container { max-width: 1050px; margin: 0 auto; }
        h1 { margin-top: 0; font-size: 24px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: #1e293b; border-radius: 10px; padding: 18px; border: 1px solid #334155; }
        .card h2 { margin-top: 0; font-size: 18px; color: #93c5fd; }
        label { display: block; font-size: 13px; margin: 8px 0 4px; color: #cbd5e1; }
        input, select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; box-sizing: border-box; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { margin-top: 14px; padding: 10px 14px; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        button.danger { background: #dc2626; margin-left: 8px; }
        button.danger:hover { background: #b91c1c; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 12px; }
        .GOOD { background: #166534; color: #dcfce7; }
        .WARNING { background: #854d0e; color: #fef9c3; }
        .ALERT { background: #991b1b; color: #fee2e2; }
        .message { margin-top: 10px; font-size: 14px; min-height: 20px; }
        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
        .stat-box { background: #0f172a; padding: 12px; border-radius: 8px; text-align: center; }
        .stat-box strong { display: block; font-size: 20px; color: #60a5fa; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; }
    </style>
</head>
<body>
<div class="container">
    <h1>Moduł analityki i kalibracji ergonomii pracy</h1>

    <div class="card" style="margin-bottom: 20px;">
        <label for="userId">Identyfikator użytkownika (User ID)</label>
        <input id="userId" type="text" value="user_1">
        <button onclick="loadUserData()">Wczytaj profil i statystyki</button>
        <button class="danger" onclick="clearHistory()">Wyczyść historię sesji</button>
        <div id="globalMessage" class="message"></div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>1. Kalibracja postawy wzorcowej</h2>
            <div class="row">
                <div><label>Ucho X</label><input id="calEarX" type="number" step="0.01" value="0.50"></div>
                <div><label>Ucho Y</label><input id="calEarY" type="number" step="0.01" value="0.30"></div>
            </div>
            <div class="row">
                <div><label>Bark X</label><input id="calShoulderX" type="number" step="0.01" value="0.50"></div>
                <div><label>Bark Y</label><input id="calShoulderY" type="number" step="0.01" value="0.60"></div>
            </div>
            <div class="row">
                <div><label>Lewy bark Y</label><input id="calLeftY" type="number" step="0.01" value="0.60"></div>
                <div><label>Prawy bark Y</label><input id="calRightY" type="number" step="0.01" value="0.60"></div>
            </div>
            <div class="row">
                <div><label>Tolerancja szyi (°)</label><input id="neckTol" type="number" step="0.5" value="10"></div>
                <div><label>Tolerancja barków</label><input id="shoulderTol" type="number" step="0.01" value="0.05"></div>
            </div>
            <label>Czas histerezy alertu (s)</label>
            <input id="hysteresisSec" type="number" value="15">
            <button onclick="saveCalibration()">Zapisz kalibrację</button>
            <div id="calibrationResult" class="message"></div>
        </div>

        <div class="card">
            <h2>2. Symulacja i ocena pomiaru</h2>
            <div class="row">
                <div><label>Ucho X</label><input id="evalEarX" type="number" step="0.01" value="0.62"></div>
                <div><label>Ucho Y</label><input id="evalEarY" type="number" step="0.01" value="0.32"></div>
            </div>
            <div class="row">
                <div><label>Bark X</label><input id="evalShoulderX" type="number" step="0.01" value="0.50"></div>
                <div><label>Bark Y</label><input id="evalShoulderY" type="number" step="0.01" value="0.60"></div>
            </div>
            <div class="row">
                <div><label>Lewy bark Y</label><input id="evalLeftY" type="number" step="0.01" value="0.60"></div>
                <div><label>Prawy bark Y</label><input id="evalRightY" type="number" step="0.01" value="0.61"></div>
            </div>
            <div class="row">
                <div>
                    <label>Tryb oceny (Strategy)</label>
                    <select id="evalMode">
                        <option value="standard">standard</option>
                        <option value="strict">strict</option>
                        <option value="relaxed">relaxed</option>
                    </select>
                </div>
                <div><label>Czas próbki (s)</label><input id="elapsedSec" type="number" step="1" value="5"></div>
            </div>
            <button onclick="evaluatePosture()">Oceń postawę</button>
            <div id="evaluationResult" class="message"></div>
        </div>
    </div>

    <div class="card">
        <h2>3. Statystyki sesji i historia pomiarów</h2>
        <div class="stats-bar">
            <div class="stat-box"><span>Próbki</span><strong id="statTotal">0</strong></div>
            <div class="stat-box"><span>Poprawna postawa</span><strong id="statGoodPct">0%</strong></div>
            <div class="stat-box"><span>Średni kąt szyi</span><strong id="statAvgAngle">0°</strong></div>
            <div class="stat-box"><span>Liczba alertów</span><strong id="statAlerts">0</strong></div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Kąt szyi (°)</th>
                    <th>Asymetria barków</th>
                    <th>Tryb</th>
                    <th>Zła postawa</th>
                    <th>Alert</th>
                </tr>
            </thead>
            <tbody id="recordsBody"></tbody>
        </table>
    </div>
</div>

<script>
    function getUserId() {
        return document.getElementById("userId").value.trim();
    }

    async function saveCalibration() {
        const payload = {
            user_id: getUserId(),
            landmarks: {
                ear: { x: Number(document.getElementById("calEarX").value), y: Number(document.getElementById("calEarY").value) },
                shoulder: { x: Number(document.getElementById("calShoulderX").value), y: Number(document.getElementById("calShoulderY").value) },
                left_shoulder: { x: 0.4, y: Number(document.getElementById("calLeftY").value) },
                right_shoulder: { x: 0.6, y: Number(document.getElementById("calRightY").value) }
            },
            neck_tolerance: Number(document.getElementById("neckTol").value),
            shoulder_tolerance: Number(document.getElementById("shoulderTol").value),
            hysteresis_seconds: Number(document.getElementById("hysteresisSec").value)
        };
        const response = await fetch("/api/calibration", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        const data = await response.json();
        const box = document.getElementById("calibrationResult");
        if (!response.ok) {
            box.textContent = "Błąd: " + data.error;
            return;
        }
        box.textContent = `Zapisano! Kąt bazowy szyi: ${data.baseline_neck_angle}°, asymetria: ${data.baseline_shoulder_diff}`;
    }

    async function evaluatePosture() {
        const payload = {
            user_id: getUserId(),
            landmarks: {
                ear: { x: Number(document.getElementById("evalEarX").value), y: Number(document.getElementById("evalEarY").value) },
                shoulder: { x: Number(document.getElementById("evalShoulderX").value), y: Number(document.getElementById("evalShoulderY").value) },
                left_shoulder: { x: 0.4, y: Number(document.getElementById("evalLeftY").value) },
                right_shoulder: { x: 0.6, y: Number(document.getElementById("evalRightY").value) }
            },
            elapsed_seconds: Number(document.getElementById("elapsedSec").value),
            mode: document.getElementById("evalMode").value
        };
        const response = await fetch("/api/posture/evaluate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        const data = await response.json();
        const box = document.getElementById("evaluationResult");
        if (!response.ok) {
            box.textContent = "Błąd: " + data.error;
            return;
        }
        box.innerHTML = `<span class="badge ${data.status}">${data.status}</span> Kąt: ${data.neck_angle}° (odchylenie: ${data.neck_deviation}°), czas histerezy: ${data.bad_posture_duration}s`;
        await loadStats();
    }

    async function loadStats() {
        const userId = getUserId();
        if (!userId) return;
        const response = await fetch(`/api/sessions/${encodeURIComponent(userId)}/stats`);
        const data = await response.json();
        if (!response.ok) return;

        document.getElementById("statTotal").textContent = data.total_samples;
        document.getElementById("statGoodPct").textContent = `${data.good_posture_percentage}%`;
        document.getElementById("statAvgAngle").textContent = `${data.average_neck_angle}°`;
        document.getElementById("statAlerts").textContent = data.alerts_count;

        const tbody = document.getElementById("recordsBody");
        tbody.innerHTML = data.records.map(r => `
            <tr>
                <td>${r.id}</td>
                <td>${r.neck_angle}</td>
                <td>${r.shoulder_asymmetry}</td>
                <td>${r.mode}</td>
                <td>${r.is_bad_posture ? "Tak" : "Nie"}</td>
                <td>${r.alert_triggered ? "TAK" : "Nie"}</td>
            </tr>
        `).join("");
    }

    async function loadUserData() {
        const userId = getUserId();
        const msg = document.getElementById("globalMessage");
        if (!userId) {
            msg.textContent = "Podaj identyfikator użytkownika.";
            return;
        }
        const calRes = await fetch(`/api/calibration/${encodeURIComponent(userId)}`);
        if (calRes.ok) {
            const cal = await calRes.json();
            document.getElementById("neckTol").value = cal.neck_tolerance;
            document.getElementById("shoulderTol").value = cal.shoulder_tolerance;
            document.getElementById("hysteresisSec").value = cal.hysteresis_seconds;
            msg.textContent = `Wczytano profil (${cal.user_id}): kąt bazowy ${cal.baseline_neck_angle}°.`;
        } else {
            msg.textContent = "Brak zapisanego profilu kalibracyjnego dla tego użytkownika.";
        }
        await loadStats();
    }

    async function clearHistory() {
        const userId = getUserId();
        if (!userId) {
            document.getElementById("globalMessage").textContent = "Podaj identyfikator użytkownika.";
            return;
        }
        const res = await fetch(`/api/sessions/${encodeURIComponent(userId)}`, { method: "DELETE" });
        const data = await res.json();
        document.getElementById("globalMessage").textContent = res.ok
            ? `Usunięto rekordów: ${data.deleted_records}`
            : `Błąd: ${data.error}`;
        await loadStats();
    }

    loadUserData();
</script>
</body>
</html>
